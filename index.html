<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>XDC-Chess</title>
    <link rel="stylesheet" href="assets/style.css">
    <script src="webxdc.js"></script>
    <script src="version.js"></script>
</head>
<body>
    <header class="topbar">
        <div class="brand"><span class="brand-logo">♞</span><span class="brand-name">XDC-Chess</span><span id="version" class="version"></span></div>
        <nav class="modes" aria-label="Play mode">
            <button data-mode="computer"><span class="mode-icon">🖥</span><span class="mode-label">vs Computer</span></button>
            <button data-mode="network"><span class="mode-icon">⇄</span><span class="mode-label">Network · 2 players</span></button>
            <button data-mode="tournament"><span class="mode-icon">🏆</span><span class="mode-label">Network · Tournament</span><span class="mode-badge" hidden>!</span></button>
            <button data-mode="puzzles" hidden><span class="mode-icon">♟</span><span class="mode-label">Puzzles</span></button>
        </nav>
        <button id="sound-toggle" class="icon-btn" aria-label="Toggle sound"></button>
    </header>

    <main class="layout">
        <aside class="side">
            <section id="game-info" class="card game-info"></section>
            <section class="card social">
                <div class="tabs" role="tablist">
                    <button data-tab="peers" role="tab">Peers <span id="peer-count" class="pill"></span></button>
                    <button data-tab="chat" role="tab">Chat room <span id="chat-unread" class="pill hot"></span></button>
                    <button data-tab="standings" role="tab">Standings</button>
                </div>
                <div id="tab-peers" class="tab-body"></div>
                <div id="tab-chat" class="tab-body chat" hidden>
                    <div id="chat-lines" class="chat-lines"></div>
                    <form id="chat-form" class="chat-form" autocomplete="off">
                        <input id="chat-input" maxlength="300" placeholder="Please be nice in the chat!">
                    </form>
                </div>
                <div id="tab-standings" class="tab-body" hidden></div>
            </section>
        </aside>

        <section class="board-area">
            <div id="board-wrap" class="board-wrap"><div id="board"></div></div>
            <div id="crosstable" class="crosstable" hidden></div>
        </section>

        <section class="table">
            <div id="player-top" class="player top"></div>
            <div class="card mid">
                <div class="controls">
                    <button id="btn-flip" class="icon-btn" title="Flip board (f)" aria-label="Flip board">⇅</button>
                    <button data-nav="first" class="icon-btn" title="First move" aria-label="First move">⏮</button>
                    <button data-nav="prev" class="icon-btn" title="Previous move" aria-label="Previous move">◀</button>
                    <button data-nav="next" class="icon-btn" title="Next move" aria-label="Next move">▶</button>
                    <button data-nav="last" class="icon-btn" title="Last move" aria-label="Last move">⏭</button>
                    <button id="btn-menu" class="icon-btn" title="Menu" aria-label="Menu">☰</button>
                </div>
                <div id="move-annotation" class="move-annotation" aria-label="Position annotation" aria-live="polite" hidden></div>
                <div id="moves" class="moves"></div>
                <div id="actions" class="actions"></div>
            </div>
            <div id="player-bottom" class="player bottom"></div>
        </section>
    </main>

    <div id="modal-root"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script src="assets/app.js"></script>
</body>
</html>
